<?xml version="1.0" encoding="UTF-8"?>
<!--
  SVG-спрайт иконок RecipeHub.

  Использование:
    <svg class="rh-icon" role="img" aria-hidden="true">
      <use href="../assets/img/sprite.svg#icon-search"></use>
    </svg>

  Часть иконок линейные (stroke), часть — заливные (fill). Атрибуты
  заданы прямо на <symbol>, чтобы иконки корректно отображались через <use>.
  Цвет наследуется от родителя через currentColor.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none">

  <!-- Линейные иконки -->
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7" />
    <line x1="16.5" y1="16.5" x2="21" y2="21" />
  </symbol>

  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4" />
    <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
  </symbol>

  <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3.5" />
    <path d="M2 21c0-3.5 3.1-6 7-6s7 2.5 7 6" />
    <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8" />
    <path d="M17.5 15.2c2.7.6 4.5 2.6 4.5 5.8" />
  </symbol>

  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5.2l3.2 1.9" />
  </symbol>

  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19" />
    <line x1="5" y1="12" x2="19" y2="12" />
  </symbol>

  <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h4l10-10-4-4L4 16z" />
    <path d="M13.5 6.5l4 4" />
  </symbol>

  <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 4H5v16h5" />
    <path d="M14 8l4 4-4 4" />
    <line x1="18" y1="12" x2="8" y2="12" />
  </symbol>

  <symbol id="icon-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6" />
    <line x1="6" y1="12" x2="18" y2="12" />
    <line x1="10" y1="18" x2="14" y2="18" />
  </symbol>

  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z" />
    <circle cx="12" cy="12" r="3" />
  </symbol>

  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="6" x2="18" y2="18" />
    <line x1="18" y1="6" x2="6" y2="18" />
  </symbol>

  <!-- Заливные иконки -->
  <symbol id="icon-heart" viewBox="0 0 24 24" fill="currentColor">
    <path
      d="M12 20.5s-7.5-4.6-9.6-9A5.2 5.2 0 0 1 12 6.3a5.2 5.2 0 0 1 9.6 5.2c-2.1 4.4-9.6 9-9.6 9z" />
  </symbol>

  <symbol id="icon-bookmark" viewBox="0 0 24 24" fill="currentColor">
    <path d="M6 3h12v18l-6-4.2L6 21z" />
  </symbol>

  <symbol id="icon-chat" viewBox="0 0 24 24" fill="currentColor">
    <path d="M4 4h16v12H8.5L4 20z" />
  </symbol>

  <symbol id="icon-star" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z" />
  </symbol>

  <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor">
    <path d="M8 5l11 7-11 7z" />
  </symbol>
</svg>
